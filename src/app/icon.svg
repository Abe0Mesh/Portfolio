<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="32" height="32" shape-rendering="crispEdges">
  <!-- Pixel Straw Hat Outline (#2b1d0e) -->
  <g fill="#2b1d0e">
    <rect x="5" y="2" width="6" height="1" />
    <rect x="4" y="3" width="1" height="2" />
    <rect x="11" y="3" width="1" height="2" />
    <rect x="3" y="5" width="1" height="4" />
    <rect x="12" y="5" width="1" height="4" />
    <rect x="1" y="9" width="2" height="1" />
    <rect x="13" y="9" width="2" height="1" />
    <rect x="0" y="10" width="1" height="2" />
    <rect x="15" y="10" width="1" height="2" />
    <rect x="1" y="12" width="14" height="1" />
  </g>

  <!-- Straw Hat Crown (#e9c46a base, #f4d58d highlight, #d4a359 shade) -->
  <g fill="#e9c46a">
    <rect x="5" y="3" width="6" height="2" />
    <rect x="4" y="5" width="8" height="2" />
  </g>
  <g fill="#f4d58d">
    <rect x="5" y="3" width="3" height="1" />
    <rect x="5" y="4" width="2" height="1" />
    <rect x="4" y="5" width="2" height="2" />
  </g>
  <g fill="#d4a359">
    <rect x="10" y="4" width="1" height="1" />
    <rect x="10" y="5" width="2" height="2" />
  </g>

  <!-- Red Ribbon Band (#c1121f + #9b0d18 shade) -->
  <rect x="4" y="7" width="8" height="2" fill="#c1121f" />
  <rect x="10" y="7" width="2" height="2" fill="#9b0d18" />

  <!-- Wide Straw Brim -->
  <rect x="1" y="10" width="14" height="2" fill="#e9c46a" />
  <rect x="1" y="10" width="9" height="1" fill="#f4d58d" />
  <rect x="11" y="11" width="4" height="1" fill="#d4a359" />
</svg>
